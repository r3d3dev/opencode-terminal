name: Downloads badge

# One number in front of the reader: the downloads on the two registries this
# extension is published to, added up. shields.io can read a single source but
# cannot add two, so the sum is computed here once a day and published on a
# branch of its own — a badge commit then never lands on main.
#
# Two files go there: downloads.json, which the badge renders, and downloads.md,
# a short page naming each registry, its count and the field it came from, so a
# click on the badge shows where the number is from rather than dropping the
# reader into this workflow's source.
#
# The files are only rewritten when a registry reports a different count, so an
# unchanged day produces no commit (the page's timestamp moves with the count,
# never on its own). If either registry cannot be read, the step fails instead of
# publishing a half-sum: a missing registry read as 0 would quietly shrink the
# total.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sum the two download counts
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          import textwrap
          import urllib.request
          from datetime import datetime, timezone

          NAMESPACE = "r3d3dev"
          EXTENSION = "opencode-terminal-cli"
          REPOSITORY = f"{NAMESPACE}/opencode-terminal"
          UA = {"User-Agent": "opencode-terminal-badge"}


          def fetch(url, data=None, accept="application/json"):
              headers = dict(UA, Accept=accept)
              if data is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)


          open_vsx = fetch(f"https://open-vsx.org/api/{NAMESPACE}/{EXTENSION}")
          open_vsx_downloads = int(open_vsx["downloadCount"])

          query = json.dumps({
              "filters": [{"criteria": [{"filterType": 7, "value": f"{NAMESPACE}.{EXTENSION}"}]}],
              "flags": 914,
          }).encode()
          gallery = fetch(
              "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery",
              data=query,
              accept="application/json;api-version=7.2-preview.1",
          )
          stats = gallery["results"][0]["extensions"][0]["statistics"]
          marketplace_downloads = int(next(s["value"] for s in stats if s["statisticName"] == "downloadCount"))

          total = open_vsx_downloads + marketplace_downloads
          print(f"open-vsx {open_vsx_downloads} + marketplace {marketplace_downloads} = {total}", file=sys.stderr)

          pathlib.Path("/tmp/downloads.json").write_text(json.dumps({
              "schemaVersion": 1,
              "label": "downloads",
              "message": str(total),
              "color": "blue",
              "cacheSeconds": 3600,
          }))

          # Written indented, because a line at column zero inside the shell
          # heredoc would end the YAML block scalar; dedent strips it back off.
          page = textwrap.dedent(f"""\
              # Downloads

              **{total}** in total, counted {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}.

              | Registry | Downloads | Where the number comes from |
              | --- | --- | --- |
              | [Open VSX](https://open-vsx.org/extension/{NAMESPACE}/{EXTENSION}) | {open_vsx_downloads} | `downloadCount` in [`/api/{NAMESPACE}/{EXTENSION}`](https://open-vsx.org/api/{NAMESPACE}/{EXTENSION}) |
              | [VS Marketplace](https://marketplace.visualstudio.com/items?itemName={NAMESPACE}.{EXTENSION}) | {marketplace_downloads} | `downloadCount` in the gallery's `extensionquery` response |

              This is what the `downloads` badge in the README shows. The badge renders
              `downloads.json`, which sits next to this file; both are regenerated by
              [the downloads workflow](https://github.com/{REPOSITORY}/blob/main/.github/workflows/downloads.yml),
              daily or on demand. Only downloads are counted, never installs, so the two
              registries are added like for like. The page is rewritten when a count moves
              and left alone otherwise.
              """)
          pathlib.Path("/tmp/downloads.md").write_text(page)
          print("wrote /tmp/downloads.json and /tmp/downloads.md")
          PY

      - name: Publish on the badges branch
        run: |
          set -euo pipefail
          # Annotations are the only channel that reaches outside the run log
          # when the log itself cannot be downloaded, so a failure says why here.
          trap 'code=$?; echo "::error::publish failed with exit $code at line $LINENO"' ERR
          cat /tmp/downloads.json; echo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges || { echo "::error::fetch of the badges branch failed"; exit 1; }
            git checkout --detach FETCH_HEAD || { echo "::error::checkout of the badges branch failed"; exit 1; }
          else
            git checkout --orphan badges || { echo "::error::creating the orphan branch failed"; exit 1; }
          fi
          if [ -f downloads.json ] && cmp -s downloads.json /tmp/downloads.json; then
            echo "the count has not changed, nothing to publish"
            exit 0
          fi
          # An orphan branch has no HEAD, and `git rm` insists on comparing with
          # one; emptying the index does the same job without needing it.
          git read-tree --empty
          cp /tmp/downloads.json /tmp/downloads.md .
          git add -f downloads.json downloads.md
          git commit --quiet -m "badge: downloads $(date -u +%Y-%m-%d)" || { echo "::error::commit failed"; exit 1; }
          if ! git push origin HEAD:badges 2>/tmp/pusherr; then
            echo "::error::push to the badges branch failed: $(tr '\n' ' ' </tmp/pusherr | tail -c 400)"
            exit 1
          fi
          echo "published: $(cat downloads.json)"
